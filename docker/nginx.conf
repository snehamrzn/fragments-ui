server {
    # Nginx runs as a standalone static file server on port 8080.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Suppress Chrome DevTools 404 errors when the app probes this path.
    location /.well-known/appspecific/ {
        return 204;
    }

    # Serve the SPA and fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets produced by Next.js.
    location /_next/static {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hide nginx version details in responses.
    server_tokens off;
}
