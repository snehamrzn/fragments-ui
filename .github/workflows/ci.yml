# .github/workflows/ci.yml

# Continuous Integration (CI) Workflow
name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        env:
          # Set dummy values for build-time environment variables
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_AWS_COGNITO_POOL_ID: dummy-pool-id
          NEXT_PUBLIC_AWS_COGNITO_CLIENT_ID: dummy-client-id
          NEXT_PUBLIC_OAUTH_SIGN_IN_REDIRECT_URL: http://localhost:3000
        run: npm run build

  docker-hub:
    name: Build and push to Docker Hub
    needs: [lint, dockerfile-lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          DOCKERHUB_REPO: snehamaharjan/fragments-ui
          SHA_TAG: sha-${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:${{ env.SHA_TAG }}, ${{ env.DOCKERHUB_REPO }}:main, ${{ env.DOCKERHUB_REPO }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AWS_COGNITO_POOL_ID=${{ secrets.NEXT_PUBLIC_AWS_COGNITO_POOL_ID }}
            NEXT_PUBLIC_AWS_COGNITO_CLIENT_ID=${{ secrets.NEXT_PUBLIC_AWS_COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_OAUTH_SIGN_IN_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_OAUTH_SIGN_IN_REDIRECT_URL }}
